<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyAntigravity</title>
  <link rel="icon" type="image/png" href="/assets/logo-32.png">
  <link rel="shortcut icon" type="image/png" href="/assets/logo-32.png">
  <link rel="apple-touch-icon" href="/assets/logo-64.png">
  <link rel="stylesheet" href="/ui/launcher.css">
</head>
<body>

  <!-- 顶部状态栏 -->
  <div class="nav-header">
    <div class="brand">
      <div>
        <div class="brand-title">EasyAG</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button type="button" class="tray-btn" data-action="hide" title="收起至系统托盘，后台静默运行">
        <span>📥 托盘静默</span>
      </button>
      <div class="status-capsule" id="clientStatusBadge">
        <div class="dot"></div>
        <span>客户端未就绪</span>
      </div>
    </div>
  </div>

  <!-- 卡片 1: 原生代理 -->
  <div class="card">
    <div class="card-label">网络与免 TUN 链路</div>
    <div class="row">
      <span style="font-weight: 500;">原生代理状态:</span>
      <span id="patchStatusBadge" style="font-weight: 600; color: var(--green);">● 本地代理就绪</span>
    </div>
    <div class="row">
      <span style="font-weight: 500;">本地代理端口:</span>
      <div class="port-cluster">
        <button type="button" class="quick-tag" data-port="7890" title="7890: Mihomo / Clash 默认端口">
          7890 <span class="tag-hint">Mihomo</span>
        </button>
        <button type="button" class="quick-tag" data-port="7897" title="7897: Clash Verge / Verge Rev 默认端口">
          7897 <span class="tag-hint">Verge</span>
        </button>
        <button type="button" class="quick-tag" data-port="10808" title="10808: v2rayN / Xray 默认端口">
          10808 <span class="tag-hint">v2ray</span>
        </button>
        <input type="text" id="proxyPortInput" inputmode="numeric" pattern="[0-9]*" maxlength="5" value="7890" placeholder="7890">
      </div>
    </div>
  </div>

  <!-- 卡片 2: 本地化汉化 -->
  <div class="card">
    <div class="card-label">界面深度汉化</div>
    <div class="row">
      <span style="font-weight: 500;">实时 DOM 字典翻译:</span>
      <label class="switch">
        <input type="checkbox" id="i18nToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span style="font-size: 11.5px; color: var(--text-dark);">词典装载状态</span>
      <span id="dictCountBadge" style="color: #c084fc; font-size: 11.5px; font-weight: 600;">已载入词条</span>
    </div>
    <div class="row">
      <span style="font-weight: 500;">AG 内上下文监控 <span style="font-size: 11px; color: var(--text-dark);">· 速度在详情中</span></span>
      <label class="switch" title="只读采集最近请求的上下文估算；关闭后移除 AG 内标记">
        <input type="checkbox" id="contextMonitorToggle" aria-label="AG 内上下文监控" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- 卡片 3: 启动模式 -->
  <div class="card">
    <div class="card-label">启动模式</div>
    <div class="mode-options" id="modeOptions">
      <button type="button" class="mode-option selected" data-mode="pilot" aria-pressed="true" data-action="mode">
        <span class="mode-title">Turbo Pilot <span class="mode-badge">推荐</span></span>
        <span class="mode-desc">自动审批 + 高危命令拦截</span>
      </button>
      <button type="button" class="mode-option" data-mode="compatibility" aria-pressed="false" data-action="mode">
        <span class="mode-title">兼容模式</span>
        <span class="mode-desc">沿用用户默认审批设置</span>
      </button>
    </div>
    <div class="protection-section" id="protectionSection">
      <div class="row protection-heading">
        <span id="protectionLabel">防护强度</span>
        <span class="protection-meta">ARES 风险提示随 Pilot 开启</span>
      </div>
      <div class="protection-options" role="group" aria-labelledby="protectionLabel" aria-describedby="protectionHint">
        <button type="button" class="protection-option" data-protection="strict" data-action="protection" aria-pressed="false">严格</button>
        <button type="button" class="protection-option selected" data-protection="standard" data-action="protection" aria-pressed="true">标准<span class="protection-recommended">默认</span></button>
        <button type="button" class="protection-option" data-protection="relaxed" data-action="protection" aria-pressed="false">宽松</button>
      </div>
      <p class="protection-hint" id="protectionHint" aria-live="polite">识别常见危险命令与参数，减少明确的查询、预演误报。启动时应用。</p>
    </div>
  </div>

  <!-- 核心启动按钮 -->
  <button class="launch-btn" id="launchBtn" data-action="launch">
    <span class="launch-icon" id="launchIcon">🚀</span>
    <span id="launchText">启动 Antigravity</span>
  </button>

  <!-- 运行日志：常显卡片，不折叠 -->
  <div class="advanced" id="advancedPanel">
    <div class="advanced-head">
      <span>运行日志</span>
      <span class="advanced-meta"><span id="approveCountBadge">风险 0</span> · <span id="rulesCountBadge">--</span> · <span id="kbCountBadge">KB --</span></span>
    </div>
    <div class="advanced-body">
      <div class="advanced-tools">
        <div class="port-cluster">
          <button type="button" class="quick-tag" data-action="open-rules">打开规则</button>
          <button type="button" class="quick-tag" data-action="reload-rules">重载规则</button>
          <button type="button" class="quick-tag" data-action="restore">恢复原设置</button>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <button type="button" class="clean-btn" data-action="copy-logs">复制日志</button>
          <button type="button" class="clean-btn" data-action="clear-logs">清空</button>
        </div>
      </div>
      <div class="console-pane">
        <div class="console" id="consoleBox">
          <div class="log-line" style="color: var(--text-dark);">[SYSTEM] EasyAG 已就绪。</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/ui/launcher.js"></script>
</body>
</html>
