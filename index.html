<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyAntigravity CLI Hub</title>
  <link rel="icon" type="image/png" href="/assets/logo-32.png">
  <link rel="shortcut icon" type="image/png" href="/assets/logo-32.png">
  <link rel="apple-touch-icon" href="/assets/logo-64.png">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('easyag-theme');
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = (saved === 'light' || saved === 'dark') ? saved : (dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/ui/launcher.css">
</head>
<body>

  <!-- 顶部导航栏 -->
  <div class="nav-header">
    <div class="brand">
      <span class="brand-title">EasyAG <span class="edition-tag">CLI</span></span>
      <span class="version-tag">v1.0.0</span>
    </div>
    <div class="nav-actions">
      <div class="status-capsule" id="cliStatusBadge" title="正在检测 Antigravity CLI...">
        <div class="dot"></div>
        <span id="cliStatusText">检测中...</span>
      </div>
      <div class="status-capsule subtle" id="terminalBadge" title="终端环境">
        <span id="terminalText">Terminal</span>
      </div>
      <button type="button" class="tray-btn icon-only" id="themeToggleBtn" data-action="toggle-theme" title="切换浅色 / 深色外观">
        <span id="themeToggleText">☀️</span>
      </button>
    </div>
  </div>

  <!-- 卡片 1: 免 TUN 进程网络代理 -->
  <div class="card">
    <div class="card-label">网络与免 TUN 链路</div>
    <div class="row">
      <div>
        <span style="font-weight: 600;">免 TUN 进程代理</span>
        <span id="proxyStatusBadge" style="font-size: 11px; font-weight: 600; color: var(--green); margin-left: 6px;">· 127.0.0.1:7890</span>
        <div style="font-size: 11px; color: var(--text-dark); margin-top: 2px;">仅注入终端子进程环境变量，零注册表污染</div>
      </div>
      <label class="switch" title="开启后启动终端时自动注入本地代理环境变量">
        <input type="checkbox" id="proxyToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row" id="proxyPortRow">
      <span style="font-weight: 500;">代理端口:</span>
      <div class="port-cluster">
        <button type="button" class="quick-tag" data-port="7890" title="7890: Mihomo / Clash 默认端口">
          7890 <span class="tag-hint">Mihomo</span>
        </button>
        <button type="button" class="quick-tag" data-port="7897" title="7897: Clash Verge / Verge Rev 默认端口">
          7897 <span class="tag-hint">Verge</span>
        </button>
        <button type="button" class="quick-tag" data-port="10808" title="10808: v2rayN / Xray 默认端口">
          10808 <span class="tag-hint">v2ray</span>
        </button>
        <input type="text" id="proxyPortInput" inputmode="numeric" pattern="[0-9]*" maxlength="5" value="7890" placeholder="7890">
      </div>
    </div>
    <div class="row" style="border-top: 1px solid var(--card-border); padding-top: 10px; margin-top: 4px;">
      <div>
        <span style="font-weight: 500;">跳过权限确认</span>
        <span style="font-size: 11px; color: var(--text-dark); margin-left: 4px;">(--dangerously-skip-permissions)</span>
        <div style="font-size: 11px; color: var(--text-dark); margin-top: 2px;">自动化运行体验，免去每次命令执行的手动确认</div>
      </div>
      <label class="switch" title="CLI 启动时附加 --dangerously-skip-permissions">
        <input type="checkbox" id="skipPermissionsToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- 卡片 2: 工作区与历史项目管理器 -->
  <div class="card project-hub-card">
    <div class="card-header-bar">
      <div class="card-label-row">
        <span class="card-label-title">工作区与历史项目</span>
        <span id="projectCountBadge" class="count-badge">0 个项目</span>
      </div>
      <div class="card-actions">
        <button type="button" class="btn-sm btn-primary" id="toggleNewProjectBtn" title="新建或导入一个本地项目工作区">
          + 新建项目
        </button>
        <button type="button" class="btn-sm btn-ghost" id="refreshProjectsBtn" title="重新扫描本地项目与会话">
          ↻ 刷新
        </button>
      </div>
    </div>

    <!-- 新建项目抽屉/表单 (默认隐藏) -->
    <div class="new-project-panel" id="newProjectPanel" style="display: none;">
      <div class="new-project-title">新建或关联本地项目</div>
      <div class="form-row">
        <label for="newProjectName">项目名称</label>
        <input type="text" id="newProjectName" placeholder="例如: MyProject (可选，默认使用文件夹名)">
      </div>
      <div class="form-row">
        <label for="newProjectPath">本地文件夹路径 *</label>
        <input type="text" id="newProjectPath" placeholder="例如: D:\Workspace\MyProject">
      </div>
      <div class="form-actions">
        <button type="button" class="btn-sm btn-ghost" id="cancelNewProjectBtn">取消</button>
        <button type="button" class="btn-sm btn-primary" id="confirmNewProjectBtn">立即创建并登记</button>
      </div>
    </div>

    <!-- 项目卡片容器 -->
    <div class="projects-container" id="projectsContainer">
      <div class="empty-hint" id="loadingHint">正在读取本地项目与会话...</div>
    </div>
  </div>

  <!-- 卡片 3: 运行日志 -->
  <div class="advanced" id="advancedPanel">
    <div class="advanced-head">
      <span>运行日志</span>
      <div style="display:flex;gap:10px;align-items:center;">
        <button type="button" class="clean-btn" data-action="copy-logs">复制日志</button>
        <button type="button" class="clean-btn" data-action="clear-logs">清空</button>
      </div>
    </div>
    <div class="advanced-body">
      <div class="console-pane">
        <div class="console" id="consoleBox">
          <div class="log-line" style="color: var(--text-dark);">[SYSTEM] EasyAG CLI Hub 已启动。</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/ui/launcher.js"></script>
</body>
</html>
