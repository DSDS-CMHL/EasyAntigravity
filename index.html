<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyAntigravity Lite</title>
  <link rel="icon" type="image/png" href="/assets/logo-32.png">
  <link rel="shortcut icon" type="image/png" href="/assets/logo-32.png">
  <link rel="apple-touch-icon" href="/assets/logo-64.png">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('easyag-theme');
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = (saved === 'light' || saved === 'dark') ? saved : (dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/ui/launcher.css">
</head>
<body>

  <!-- 顶部状态栏 -->
  <div class="nav-header">
    <div class="brand">
      <span class="brand-title">EasyAG <span class="edition-tag">Lite</span></span>
      <button type="button" class="version-pill" id="updateBtn" data-action="check-update" title="检查并拉取 Lite 版最新内核与汉化词典，免重装直接生效">
        <span id="versionBadge">v4.0.4</span>
        <span class="version-sep">·</span>
        <span id="updateActionText">↻ 检查更新</span>
      </button>
    </div>
    <div class="nav-actions">
      <button type="button" class="tray-btn icon-only" id="themeToggleBtn" data-action="toggle-theme" title="切换浅色 / 深色外观（顶栏与面板同步变色）">
        <span id="themeToggleText">☀️</span>
      </button>
      <div class="status-capsule" id="clientStatusBadge">
        <div class="dot"></div>
        <span>未运行</span>
      </div>
    </div>
  </div>

  <!-- 卡片 1: 原生代理 -->
  <div class="card">
    <div class="card-label">网络与免 TUN 链路</div>
    <div class="row">
      <span style="font-weight: 500;">免 TUN 进程代理 <span id="patchStatusBadge" style="font-size: 11px; font-weight: 600; color: var(--green);">· 本地代理就绪</span></span>
      <label class="switch" title="开启后为 AG 进程注入本地代理；直连环境（如海外/台湾/全局VPN用户）可关闭">
        <input type="checkbox" id="proxyToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row" id="proxyPortRow">
      <span style="font-weight: 500;">本地代理端口:</span>
      <div class="port-cluster">
        <button type="button" class="quick-tag" data-port="7890" title="7890: Mihomo / Clash 默认端口">
          7890 <span class="tag-hint">Mihomo</span>
        </button>
        <button type="button" class="quick-tag" data-port="7897" title="7897: Clash Verge / Verge Rev 默认端口">
          7897 <span class="tag-hint">Verge</span>
        </button>
        <button type="button" class="quick-tag" data-port="10808" title="10808: v2rayN / Xray 默认端口">
          10808 <span class="tag-hint">v2ray</span>
        </button>
        <input type="text" id="proxyPortInput" inputmode="numeric" pattern="[0-9]*" maxlength="5" value="7890" placeholder="7890">
      </div>
    </div>
  </div>

  <!-- 卡片 2: 本地化汉化与上下文圆环 -->
  <div class="card">
    <div class="card-label">界面深度汉化与监控</div>
    <div class="row">
      <span style="font-weight: 500;">实时 DOM 字典翻译 <span id="dictCountBadge" class="dict-badge">· 已载入词条</span></span>
      <label class="switch">
        <input type="checkbox" id="i18nToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span style="font-weight: 500;">AG 内上下文圆环 <span style="font-size: 11px; color: var(--text-dark);">· 速度在详情中</span></span>
      <label class="switch" title="只读采集最近请求的上下文估算；关闭后移除 AG 内标记">
        <input type="checkbox" id="contextMonitorToggle" aria-label="AG 内上下文圆环" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- 启动目标切换器：检测到同时安装了桌面版与 IDE 时显示 -->
  <div class="target-switcher" id="targetSwitcher" hidden>
    <span class="switcher-label">启动目标</span>
    <div class="switcher-pills" role="radiogroup" aria-label="选择启动目标">
      <button type="button" class="target-pill active" data-target="hub" id="targetHubBtn" title="启动 Antigravity 官方桌面客户端">
        <span class="pill-icon">💻</span>
        <span>桌面版</span>
      </button>
      <button type="button" class="target-pill" data-target="ide" id="targetIdeBtn" title="启动 Antigravity IDE 编辑器版（基于 VS Code）">
        <span class="pill-icon">📝</span>
        <span>IDE 版</span>
      </button>
    </div>
  </div>

  <!-- 核心启动按钮 -->
  <button class="launch-btn" id="launchBtn" data-action="launch">
    <span class="launch-icon" id="launchIcon">🚀</span>
    <span id="launchText">启动 Antigravity</span>
  </button>

  <!-- 运行日志：常显卡片，不折叠 -->
  <div class="advanced" id="advancedPanel">
    <div class="advanced-head">
      <span>运行日志</span>
      <div style="display:flex;gap:10px;align-items:center;">
        <button type="button" class="clean-btn" data-action="copy-logs">复制日志</button>
        <button type="button" class="clean-btn" data-action="clear-logs">清空</button>
      </div>
    </div>
    <div class="advanced-body">
      <div class="console-pane">
        <div class="console" id="consoleBox">
          <div class="log-line" style="color: var(--text-dark);">[SYSTEM] EasyAG 已就绪。</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/ui/launcher.js"></script>
</body>
</html>
