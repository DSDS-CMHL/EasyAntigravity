name: Tauri Build

on:
  push:
    branches: [feat/tauri-gui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            name: windows-x64
          - runner: macos-14
            target: aarch64-apple-darwin
            bundles: app
            name: macos-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
            name: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Backend dependencies and regressions
        run: |
          npm ci
          node --check server.js
          node test/danger-rules.test.js
          node test/approval-lifecycle.test.js
      - name: Prepare self-contained runtime
        run: node scripts/prepare-tauri.cjs ${{ matrix.target }}
      - name: Include runtime license
        shell: bash
        run: curl --fail --location "https://raw.githubusercontent.com/nodejs/node/$(node -p process.version)/LICENSE" --output src-tauri/backend/NODE-LICENSE.txt
      - name: Test packaged backend without developer dependencies
        shell: bash
        run: |
          export EASYAG_TEST_NODE="$PWD/src-tauri/binaries/easyag-node-${{ matrix.target }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then export EASYAG_TEST_NODE="$EASYAG_TEST_NODE.exe"; fi
          export EASYAG_TEST_SERVER="$PWD/src-tauri/backend/server.js"
          node test/tauri-lifecycle.test.cjs
      - name: Build native application
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/EasyAntigravity.app"
          test -f "$app/Contents/Resources/backend/server.js"
          test -f "$app/Contents/Resources/backend/node_modules/ws/package.json"
          test -x "$app/Contents/MacOS/easyag-node"
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "EasyAntigravity-2.0.1-tauri-${{ matrix.name }}.zip"
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: EasyAntigravity-2.0.1-tauri-${{ matrix.name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: EasyAntigravity-2.0.1-tauri-${{ matrix.name }}
          path: EasyAntigravity-2.0.1-tauri-${{ matrix.name }}.zip
          if-no-files-found: error
          retention-days: 14
      - name: Build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata-${{ matrix.name }}
          path: |
            src-tauri/Cargo.lock
            src-tauri/tauri.conf.json
          retention-days: 14
