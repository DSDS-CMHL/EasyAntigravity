name: Tauri Build

on:
  push:
    branches: [feat/tauri-gui]
  workflow_dispatch:

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
        include:
          - platform: windows-latest
            artifact-name: EasyAntigravity-win-x64
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            artifact-name: EasyAntigravity-macos-x64
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm install

      - name: Create package.json for Tauri
        run: |
          cd src-tauri
          cat > package.json << 'EOF'
          {
            "name": "easyantigravity",
            "version": "2.0.1",
            "scripts": {
              "tauri": "tauri"
            }
          }
          EOF

      - name: Build Tauri app
        run: |
          npm install -g @tauri-apps/cli
          cd src-tauri
          npx tauri build --target ${{ matrix.target }}
        env:
          TAURI_PRIVATE_KEY: ""

      - name: Collect artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          mkdir -p dist-tauri
          Copy-Item "src-tauri\target\*\release\*.exe" "dist-tauri\" -ErrorAction SilentlyContinue
          Copy-Item "index.html" "dist-tauri\"
          Copy-Item -Recurse "dicts" "dist-tauri\"
          Copy-Item -Recurse "assets" "dist-tauri\"
          Copy-Item "backup\*.json" "dist-tauri\" -ErrorAction SilentlyContinue
          Copy-Item "danger-rules.json" "dist-tauri\" -ErrorAction SilentlyContinue
          Copy-Item "server.js" "dist-tauri\" -ErrorAction SilentlyContinue
          
          Compress-Archive -Path "dist-tauri\*" -DestinationPath "${{ matrix.artifact-name }}.zip"
          ls -lh "${{ matrix.artifact-name }}.zip"

      - name: Collect artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p dist-tauri
          find src-tauri/target -name "*.app" -exec cp -r {} dist-tauri/ \;
          cp index.html dist-tauri/
          cp -r dicts dist-tauri/
          cp -r assets dist-tauri/
          cp backup/*.json dist-tauri/ 2>/dev/null || true
          cp danger-rules.json dist-tauri/ 2>/dev/null || true
          cp server.js dist-tauri/ 2>/dev/null || true
          
          cd dist-tauri
          zip -r "../${{ matrix.artifact-name }}.zip" .
          cd ..
          ls -lh "${{ matrix.artifact-name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.zip
          retention-days: 7
