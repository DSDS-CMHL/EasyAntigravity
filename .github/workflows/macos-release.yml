name: Release macOS 4.0.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            build-args: --bundles app
            name: macos-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            build-args: --bundles app
            name: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Backend dependencies and regressions
        run: |
          npm ci
          npm run check
          npm test
      - name: Prepare self-contained runtime
        run: node scripts/prepare-tauri.cjs ${{ matrix.target }}
      - name: Include runtime license
        shell: bash
        run: curl --fail --location "https://raw.githubusercontent.com/nodejs/node/$(node -p process.version)/LICENSE" --output src-tauri/backend/NODE-LICENSE.txt
      - name: Test packaged backend without developer dependencies
        shell: bash
        run: |
          export EASYAG_TEST_NODE="$PWD/src-tauri/binaries/easyag-node-${{ matrix.target }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then export EASYAG_TEST_NODE="$EASYAG_TEST_NODE.exe"; fi
          export EASYAG_TEST_SERVER="$PWD/src-tauri/backend/server.js"
          node test/tauri-lifecycle.test.cjs
      - name: Build native application
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} ${{ matrix.build-args }}
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/EasyAntigravity.app"
          test -f "$app/Contents/Resources/backend/server.js"
          test -f "$app/Contents/Resources/backend/node_modules/ws/package.json"
          test -x "$app/Contents/MacOS/easyag-node"
          
          # 1. 对 easyag-node 补充 Hardened Runtime 与 JIT 权限 (解决 Apple Silicon V8 ThreadIsolation SIGTRAP 退出码 133)
          codesign --force --options runtime --sign - --entitlements src-tauri/Entitlements.plist "$app/Contents/MacOS/easyag-node"

          # 2. 对整个 EasyAntigravity.app 补充 Entitlements 签名
          codesign --force --options runtime --deep --sign - --entitlements src-tauri/Entitlements.plist "$app"

          # 3. 校验签名与 JIT 权限输出
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements :- "$app/Contents/MacOS/easyag-node"

          # 4. 关键自检：在当前 runner 上执行 V8 初始化测试，确保不会出现 SIGTRAP
          "$app/Contents/MacOS/easyag-node" -e "console.log('easyag-node JIT OK, V8:', process.versions.v8)"

          # 5. 打包分发 ZIP 包（保持 macOS 扩展属性、代码签名与完整 App 外壳）
          mkdir -p dist-tauri
          zip_name="EasyAntigravity-4.0.6-lite-${{ matrix.name }}-beta.zip"
          zip_path="dist-tauri/$zip_name"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip_path"

          # 6. 完整性自检：校验 ZIP 结构与中央目录，杜绝坏包
          unzip -t "$zip_path"

          # 7. 模拟解压校验关键入口与可执行权限
          verify_dir="dist-tauri/verify"
          mkdir -p "$verify_dir"
          ditto -x -k "$zip_path" "$verify_dir/"
          test -d "$verify_dir/EasyAntigravity.app"
          test -x "$verify_dir/EasyAntigravity.app/Contents/MacOS/EasyAntigravity"
          test -x "$verify_dir/EasyAntigravity.app/Contents/MacOS/easyag-node"
          test -f "$verify_dir/EasyAntigravity.app/Contents/Resources/backend/server.js"
          rm -rf "$verify_dir"

          # 8. 输出 SHA256 校验和到日志
          shasum -a 256 "$zip_path"
      - name: Upload macOS app (Beta)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: EasyAntigravity-4.0.6-lite-${{ matrix.name }}-beta
          path: dist-tauri/EasyAntigravity-4.0.6-lite-${{ matrix.name }}-beta.zip
          if-no-files-found: error
          retention-days: 14
      - name: Build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata-${{ matrix.name }}
          path: |
            src-tauri/Cargo.lock
            src-tauri/tauri.conf.json
          retention-days: 14
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: EasyAntigravity-4.0.6-lite-macos-*-beta
          merge-multiple: true
          path: release-out
      - name: Verify packages and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-out
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 2
          for f in *.zip; do unzip -t "$f"; sha256sum "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.6-lite
          target_commitish: ${{ github.sha }}
          name: EasyAG v4.0.6 Lite · 长对话性能与 macOS 菜单栏图标
          make_latest: true
          overwrite_files: false
          fail_on_unmatched_files: true
          body_path: docs/RELEASE-v4.0.6.md
          files: |
            release-out/*.zip
            release-out/*.sha256
