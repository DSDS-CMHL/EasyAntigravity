[package]
name = "easyantigravity"
version = "4.0.4"
edition = "2021"
description = "EasyAntigravity Lite - TUN-free process proxy, reversible DOM localization and context ring"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "easyantigravity"
path = "src/main.rs"
